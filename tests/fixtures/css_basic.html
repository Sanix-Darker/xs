<!DOCTYPE html>
<html><head><title>CSS Basic</title>
<style>
/* a comment with { braces } and ; semicolons */
h1 { font-size: 32px; text-align: center; }
p { font-size: 18px; }
.note { background: #ffffcc; }
#main { width: 600px; }
</style>
</head>
<body>
<h1>Styled Heading</h1>
<p class="note">A note paragraph.</p>
<div id="main"><p>Inside main.</p></div>
</body></html>
